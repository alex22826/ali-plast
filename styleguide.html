<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI-кит · ALI PLAST</title>
  <meta name="description" content="Дизайн-система CHIRCHIQ ALI PLAST: цвета, шрифты, кнопки, формы, сайдбар, разделы и компоненты.">
  <meta name="theme-color" content="#0B1120">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css?v=1">
  <script>try { var t = localStorage.getItem('ap.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    .sg-top { position: sticky; top: 0; z-index: 30; background: var(--ink-900); color: #fff; }
    .sg-top::after { content: ''; position: absolute; inset: auto 0 0; height: 2px; background: var(--iris); }
    .sg-bar { max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
    .sg-bar b { font: 700 15px/1 var(--font-display); letter-spacing: .03em; }
    .sg-bar small { display: block; color: var(--ink-300); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin-top: 4px; }
    .sg-nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 1280px; margin: 0 auto; padding: 0 16px 10px; }
    .sg-nav a { color: var(--ink-300); font-weight: 700; font-size: 13px; padding: 7px 10px; border-radius: 8px; white-space: nowrap; text-decoration: none; }
    .sg-nav a:hover { color: #fff; background: rgba(255, 255, 255, .06); }
    .sg-main { max-width: 1280px; margin: 0 auto; padding: 28px 24px 80px; }
    .sg-hero { border-radius: 26px; padding: 34px; background: radial-gradient(70% 120% at 85% 20%, rgba(143, 169, 255, .3), transparent 60%), radial-gradient(50% 80% at 100% 100%, rgba(255, 180, 219, .2), transparent 60%), var(--ink-900); color: #fff; display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: center; overflow: hidden; position: relative; }
    .sg-hero h1 { font-size: 34px; color: #fff; }
    .sg-hero p { color: var(--ink-300); max-width: 560px; margin-top: 12px; font-size: 15px; }
    .sg-sec { margin-top: 48px; scroll-margin-top: 110px; }
    .sg-sec > h2 { font-size: 22px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
    .sg-sec > h2 span { font: 700 12px var(--font-mono); color: var(--text-3); }
    .sg-sec > p.lead { color: var(--text-2); margin-bottom: 18px; max-width: 820px; }
    .sw { border-radius: 14px; border: 1px solid var(--border); overflow: hidden; background: var(--surface); }
    .sw i { display: block; height: 64px; }
    .sw div { padding: 9px 11px; }
    .sw b { display: block; font-size: 12.5px; }
    .sw code { font-size: 11px; color: var(--text-3); }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .demo { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .spec { font: 600 11.5px var(--font-mono); color: var(--text-3); }
    .type-row { display: grid; grid-template-columns: 200px 1fr; gap: 18px; padding: 14px 0; border-top: 1px dashed var(--border); align-items: baseline; }
    .sb-demo { position: relative; height: 640px; border-radius: 18px; overflow: hidden; display: grid; grid-template-columns: 268px 1fr; border: 1px solid var(--border); }
    .sb-demo .sidebar { position: relative; height: 100%; transform: none; box-shadow: none; }
    .sb-demo .demo-main { background: var(--bg); display: flex; flex-direction: column; min-width: 0; }
    .sb-demo .topbar { position: relative; }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
    .icon-grid div { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 14px 8px 10px; text-align: center; }
    .icon-grid svg { width: 22px; height: 22px; margin: 0 auto 8px; color: var(--text); }
    .icon-grid code { font-size: 10.5px; color: var(--text-3); }
    .matrix td, .matrix th { text-align: center; }
    .matrix td:first-child, .matrix th:first-child { text-align: left; }
    @media (max-width: 900px) { .sg-hero { grid-template-columns: 1fr; padding: 24px; } .type-row { grid-template-columns: 1fr; gap: 6px; } .sb-demo { grid-template-columns: 1fr; height: auto; } .sb-demo .sidebar { height: 600px; } .sb-demo .demo-main { display: none; } }
  </style>
</head>
<body>
  <script src="assets/js/vendor/qrcode.js"></script>
  <script src="assets/js/core.js?v=1"></script>
  <script src="assets/js/ui.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script src="assets/js/styleguide.js?v=1"></script>
</body>
</html>
